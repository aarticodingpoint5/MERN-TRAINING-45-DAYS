<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Brand Headers</title>
</head>

<body>

    <section>

        <header>
            <h1>Netflix</h1>

            <nav>
                <a href="#">Home</a> |
                <a href="#">TV Shows</a> |
                <a href="#">Movies</a> |
                <a href="#">My List</a>
            </nav>

        </header>

    </section>

    <hr>

    <section>

        <header>
            <h1>Amazon</h1>

            <nav>
                <a href="#">All</a> |
                <a href="#">Electronics</a> |
                <a href="#">Fashion</a> |
                <a href="#">Prime</a>
            </nav>

        </header>

    </section>

    <hr>

    <section>

        <header>
            <h1>Flipkart</h1>

            <nav>
                <a href="#">Electronics</a> |
                <a href="#">Fashion</a> |
                <a href="#">Home</a> |
                <a href="#">Grocery</a>
            </nav>

        </header>

    </section>

</body>

</html>
