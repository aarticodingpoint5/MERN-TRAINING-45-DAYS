<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Basket Shop</title>
  <style>
    :root{
      --bg:#f5f7fb;
      --card:#ffffff;
      --text:#1f2937;
      --muted:#6b7280;
      --pri:#2563eb;
      --pri2:#1d4ed8;
      --good:#16a34a;
      --bad:#dc2626;
      --warn:#f59e0b;
      --line:#e5e7eb;
      --shadow:0 10px 30px rgba(15,23,42,.08)
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:linear-gradient(180deg,#eef4ff, #f8fafc 35%, #eef2ff);
      color:var(--text)
    }

    .wrap{max-width:1200px;margin:auto;padding:18px}

    .top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
      background:rgba(255,255,255,.75);
      backdrop-filter:blur(8px);
      padding:16px 18px;
      border:1px solid rgba(255,255,255,.7);
      border-radius:20px;
      box-shadow:var(--shadow);
      position:sticky;
      top:12px;
      z-index:10
    }

    .brand h1{margin:0;font-size:28px}
    .brand p{margin:4px 0 0;color:var(--muted);font-size:14px}

    .searchBox{
      flex:1;
      min-width:240px;
      display:flex;
      gap:10px;
      align-items:center
    }

    .searchBox input{
      width:100%;
      padding:14px 16px;
      border:1px solid var(--line);
      border-radius:14px;
      font-size:15px;
      outline:none;
      background:#fff
    }

    .searchBox input:focus{
      border-color:#93c5fd;
      box-shadow:0 0 0 4px rgba(59,130,246,.12)
    }

    .pill{
      background:#eff6ff;
      color:var(--pri2);
      padding:10px 14px;
      border-radius:999px;
      font-weight:700;
      font-size:13px;
      white-space:nowrap
    }

    .grid{
      display:grid;
      grid-template-columns:2fr 1fr;
      gap:18px;
      margin-top:18px
    }

    .panel{
      background:rgba(255,255,255,.8);
      border:1px solid rgba(255,255,255,.8);
      border-radius:22px;
      box-shadow:var(--shadow);
      padding:18px
    }

    .sectionTitle{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-bottom:14px
    }

    .sectionTitle h2{margin:0;font-size:20px}
    .sectionTitle span{color:var(--muted);font-size:13px}

    .products{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:16px
    }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      padding:16px;
      position:relative;
      overflow:hidden;
      transition:.2s ease;
      display:flex;
      flex-direction:column;
      gap:10px
    }

    .card:hover{
      transform:translateY(-3px);
      box-shadow:0 12px 24px rgba(37,99,235,.08)
    }

    .card.expensive{
      border-color:#fde68a;
      background:linear-gradient(180deg,#fffdf4,#ffffff)
    }

    .badge{
      position:absolute;
      top:12px;
      right:12px;
      background:var(--warn);
      color:#111827;
      font-size:12px;
      font-weight:700;
      padding:6px 10px;
      border-radius:999px
    }

    .img{
      height:140px;
      border-radius:14px;
      display:grid;
      place-items:center;
      font-size:52px;
      background:linear-gradient(135deg,#dbeafe,#eef2ff);
      border:1px solid #dbeafe
    }

    .name{font-size:18px;font-weight:700}
    .meta{color:var(--muted);font-size:13px;line-height:1.4}
    .price{font-size:20px;font-weight:800;color:var(--good)}

    .btn{
      border:0;
      border-radius:12px;
      padding:12px 14px;
      font-weight:700;
      cursor:pointer;
      transition:.2s ease
    }

    .btn.primary{background:var(--pri);color:#fff}
    .btn.primary:hover{background:var(--pri2)}
    .btn.ghost{background:#eff6ff;color:var(--pri2)}

    .cartHead{
      display:flex;
      gap:10px;
      justify-content:space-between;
      align-items:center;
      margin-bottom:12px
    }

    .cartStats{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
      margin-bottom:14px
    }

    .stat{
      background:#f8fafc;
      border:1px solid var(--line);
      border-radius:16px;
      padding:12px;
      text-align:center
    }

    .stat b{
      display:block;
      font-size:20px;
      margin-top:4px
    }

    .cartItems{
      display:flex;
      flex-direction:column;
      gap:12px
    }

    .item{
      border:1px solid var(--line);
      border-radius:16px;
      padding:12px;
      background:#fff;
      display:grid;
      grid-template-columns:1fr auto;
      gap:10px
    }

    .itemTop{
      display:flex;
      justify-content:space-between;
      gap:8px;
      align-items:flex-start
    }

    .itemName{font-weight:700}
    .itemPrice,.itemSub{color:var(--muted);font-size:13px;margin-top:3px}

    .qtyWrap{
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
      margin-top:10px
    }

    .qtyBtn{
      width:34px;
      height:34px;
      border-radius:10px;
      border:1px solid var(--line);
      background:#f8fafc;
      font-size:18px;
      cursor:pointer
    }

    .qtyNum{min-width:24px;text-align:center;font-weight:700}
    .remove{background:#fee2e2;color:var(--bad)}

    .footerBox{
      margin-top:14px;
      padding-top:14px;
      border-top:1px dashed var(--line)
    }

    .row{
      display:flex;
      justify-content:space-between;
      gap:10px;
      margin:8px 0;
      color:#374151
    }

    .row.total{font-size:18px;font-weight:800}

    .empty{
      padding:24px;
      border:2px dashed #cbd5e1;
      border-radius:18px;
      text-align:center;
      color:var(--muted);
      background:#fbfdff
    }

    .switch{
      display:flex;
      align-items:center;
      gap:10px;
      margin-top:10px;
      font-size:14px;
      color:#374151
    }

    .note{
      font-size:12px;
      color:var(--muted);
      margin-top:10px;
      line-height:1.5
    }

    @media (max-width: 900px){
      .grid{grid-template-columns:1fr}
      .top{position:static}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <h1>Smart Basket Shop</h1>
        <p>Beginner-friendly interactive shopping cart with live search and real-time totals.</p>
      </div>
      <div class="searchBox">
        <input id="searchInput" type="text" placeholder="Search products by name..." oninput="filterProducts()" />
        <div class="pill" id="productCount">0 Products</div>
      </div>
    </div>

    <div class="grid">
      <div class="panel">
        <div class="sectionTitle">
          <h2>Products</h2>
          <span>Click Add to Cart</span>
        </div>
        <div id="productList" class="products"></div>
      </div>

      <div class="panel">
        <div class="cartHead">
          <div>
            <h2 style="margin:0">Your Cart</h2>
            <span style="color:var(--muted);font-size:13px">Update quantity, remove items, and track totals.</span>
          </div>
          <button class="btn ghost" onclick="clearCart()">Clear Cart</button>
        </div>

        <div class="cartStats">
          <div class="stat">Items<b id="totalItems">0</b></div>
          <div class="stat">Products<b id="cartProducts">0</b></div>
          <div class="stat">Savings<b id="savings">₹0</b></div>
        </div>

        <div class="switch">
          <input id="discountToggle" type="checkbox" onchange="renderCart()" />
          <label for="discountToggle">Apply 10% student discount</label>
        </div>

        <div id="cartItems" class="cartItems"></div>

        <div class="footerBox">
          <div class="row"><span>Subtotal</span><span id="subtotal">₹0</span></div>
          <div class="row"><span>Discount</span><span id="discount">-₹0</span></div>
          <div class="row total"><span>Total</span><span id="totalPrice">₹0</span></div>
          <div class="note">
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const products = [ 
{ id: 1, name: 'Smartphone', price: 12999, emoji: '📱', desc: '5G phone with great camera.' },
      { id: 2, name: 'Laptop', price: 45999, emoji: '💻', desc: 'Lightweight laptop for study and work.' },
      { id: 3, name: 'Headphones', price: 1199, emoji: '🎧', desc: 'Comfortable wireless sound.' },
      { id: 4, name: 'Smart Watch', price: 5499, emoji: '⌚', desc: 'Track steps, calls, and health.' },
      { id: 5, name: 'Charger', price: 499, emoji: '🔌', desc: 'Fast charging adapter.' },
      { id: 6, name: 'Keyboard', price: 1499, emoji: '⌨️', desc: 'Smooth typing experience.' }
{ id: 7,  name: "Mouse",        price: 899,   emoji: "🖱️", desc: "Wireless mouse for smooth control." },
{ id: 8,  name: "Earbuds",      price: 1999,  emoji: "🎧", desc: "Compact earbuds with clear sound." },
{ id: 9,  name: "Speaker",      price: 2499,  emoji: "🔊", desc: "Portable Bluetooth speaker." },
{ id: 10, name: "Monitor",      price: 8999,  emoji: "🖥️", desc: "Full HD monitor for work and gaming." },
{ id: 11, name: "Tablet",       price: 15999, emoji: "📱", desc: "Lightweight tablet for study and media." },
{ id: 12, name: "Webcam",       price: 1499,  emoji: "📷", desc: "HD webcam for online classes and meetings." },
{ id: 13, name: "Printer",      price: 7999,  emoji: "🖨️", desc: "Fast printer for home and office use." },
{ id: 14, name: "Power Bank",   price: 1299,  emoji: "🔋", desc: "Portable backup battery for devices." },
{ id: 15, name: "Router",       price: 2299,  emoji: "📡", desc: "High-speed Wi-Fi router for stable internet." }
    ];

    let cart = [];

    const productList = document.getElementById('productList');
    const cartItems = document.getElementById('cartItems');
    const searchInput = document.getElementById('searchInput');
    const productCount = document.getElementById('productCount');

    function renderProducts(list) {
      productList.innerHTML = list.map(product => `
        <div class="card ${product.price > 1000 ? 'expensive' : ''}">
          ${product.price > 1000 ? '<div class="badge">Featured Deal</div>' : ''}
          <div class="img">${product.emoji}</div>
          <div class="name">${product.name}</div>
          <div class="meta">${product.desc}</div>
          <div class="price">₹${product.price.toLocaleString()}</div>
          <button class="btn primary" onclick="addToCart(${product.id})">Add to Cart</button>
        </div>
      `).join('');
      productCount.textContent = `${list.length} Product${list.length !== 1 ? 's' : ''}`;
    }

    function filterProducts() {
      const keyword = searchInput.value.toLowerCase();
      const filtered = products.filter(p => p.name.toLowerCase().includes(keyword));
      renderProducts(filtered);
    }

    function addToCart(id) {
      const item = cart.find(p => p.id === id);
      if (item) {
        item.quantity += 1;
      } else {
        const product = products.find(p => p.id === id);
        cart.push({ ...product, quantity: 1 });
      }
      renderCart();
    }

    function updateQuantity(id, change) {
      const item = cart.find(p => p.id === id);
      if (!item) return;
      item.quantity = item.quantity + change;
      if (item.quantity <= 0) cart = cart.filter(p => p.id !== id);
      renderCart();
    }

    function removeFromCart(id) {
      cart = cart.filter(p => p.id !== id);
      renderCart();
    }

    function clearCart() {
      cart = [];
      renderCart();
    }

    function calculateTotal() {
      let totalItems = 0;
      let subtotal = 0;

      cart.forEach(item => {
        totalItems += item.quantity;
        subtotal += item.price * item.quantity;
      });

      const discountOn = document.getElementById('discountToggle').checked;
      const discount = discountOn ? subtotal * 0.1 : 0;
      const totalPrice = subtotal - discount;

      return { totalItems, subtotal, discount, totalPrice };
    }

    function renderCart() {
      if (cart.length === 0) {
        cartItems.innerHTML = '<div class="empty">Your cart is empty. Add products from the left side.</div>';
      } else {
        cartItems.innerHTML = cart.map(item => `
          <div class="item">
            <div>
              <div class="itemTop">
                <div>
                  <div class="itemName">${item.emoji} ${item.name}</div>
                  <div class="itemPrice">Price: ₹${item.price.toLocaleString()}</div>
                </div>
                <button class="btn remove" onclick="removeFromCart(${item.id})">Remove</button>
              </div>
              <div class="qtyWrap">
                <button class="qtyBtn" onclick="updateQuantity(${item.id}, -1)">-</button>
                <span class="qtyNum">${item.quantity}</span>
                <button class="qtyBtn" onclick="updateQuantity(${item.id}, 1)">+</button>
                <span class="itemSub">Subtotal: ₹${(item.price * item.quantity).toLocaleString()}</span>
              </div>
            </div>
          </div>
        `).join('');
      }

      const totals = calculateTotal();
      document.getElementById('totalItems').textContent = totals.totalItems;
      document.getElementById('cartProducts').textContent = cart.length;
      document.getElementById('subtotal').textContent = '₹' + totals.subtotal.toLocaleString();
      document.getElementById('discount').textContent = '-₹' + totals.discount.toLocaleString();
      document.getElementById('totalPrice').textContent = '₹' + totals.totalPrice.toLocaleString();
      document.getElementById('savings').textContent = '₹' + totals.discount.toLocaleString();
    }

    renderProducts(products);
    renderCart();
  </script>
</body>
</html>
